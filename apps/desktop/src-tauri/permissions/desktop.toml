[[permission]]
identifier = "desktop-runtime"
description = "Allows the EchoSpeak renderer to inspect or recover its owned local service, use explicit user-invoked folder pickers, control its own window, open http(s) links in the default browser, and check for and install signed updates."
commands.allow = [
  "desktop_runtime",
  "restart_desktop_backend",
  "pick_project_folder",
  "pick_connection_folder",
  "open_desktop_logs",
  "control_desktop_window",
  "open_settings_window",
  "open_setup_window",
  "open_companion_window",
  "set_companion_always_on_top",
  "desktop_window_label",
  "open_external_url",
  "check_for_update",
  "install_update"
]
