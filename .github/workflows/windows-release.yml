name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v10.*"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    environment: windows-release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version and signing configuration
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_KEY) { throw 'Configure the existing updater private key in the windows-release environment. Do not generate a new key for an existing installation.' }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'The tag and application version differ.' }
          New-Item -ItemType Directory -Force .release-secrets | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD '.release-secrets/updater.key'), $env:UPDATER_KEY, [Text.UTF8Encoding]::new($false))
      - name: Install build dependencies
        run: |
          python -m pip install -r apps/backend/requirements.txt 'PyInstaller==6.21.0' cryptography
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          npm --prefix apps/web ci
          if ($LASTEXITCODE -ne 0) { throw 'Web dependency installation failed.' }
          npm --prefix apps/desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed.' }
      - name: Build and verify signed update installers
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLISHER_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PUBLISHER_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $argsForRelease = @{ PythonExecutable = (Get-Command python).Source; KeyPath = (Join-Path $PWD '.release-secrets/updater.key') }
          if ($env:PUBLISHER_PFX) {
            $pfx = Join-Path $PWD '.release-secrets/publisher.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PUBLISHER_PFX))
            $password = ConvertTo-SecureString $env:PUBLISHER_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $env:ECHOSPEAK_SIGN_CERT_SHA1 = ($certificate | Where-Object HasPrivateKey | Select-Object -First 1).Thumbprint
            if (-not $env:ECHOSPEAK_SIGN_CERT_SHA1) { throw 'No publisher signing certificate with a private key was imported.' }
            $argsForRelease.RequirePublisherSignature = $true
          }
          ./apps/desktop/scripts/release-windows.ps1 @argsForRelease
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: EchoSpeak-Windows
          path: release/v*/
          if-no-files-found: error
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json isDraft | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'A release already exists. Review it before replacing any signed assets.' }
          $files = Get-ChildItem -LiteralPath "release/$tag" -File | ForEach-Object FullName
          gh release create $tag @files --verify-tag --draft --title "EchoSpeak $($tag.Substring(1))" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
      - name: Remove temporary signing files
        if: always()
        run: |
          $secretsPath = [IO.Path]::GetFullPath((Join-Path $PWD '.release-secrets'))
          if ($secretsPath -ne (Join-Path $env:GITHUB_WORKSPACE '.release-secrets')) { throw 'Unexpected cleanup path.' }
          if (Test-Path -LiteralPath $secretsPath) { Remove-Item -LiteralPath $secretsPath -Recurse -Force }
