# Builds the public website (apps/web/site) and publishes it to GitHub Pages:
# https://ty0x7.github.io/EchoSpeak/ — runs on every change to main that touches the web app.
#
# Hardened against the 2025-26 supply-chain attacks (docs/research/security-audit-2026-10-25.md):
# actions are pinned to commit SHAs (a moved tag can't swap the code), only the deploy job can
# write to Pages, checkout doesn't keep the token, and npm install scripts don't run.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's Pages settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        # The 2026 npm worms (Shai-Hulud, ChainDrop) spread through install scripts; the site build needs none.
        run: npm ci --ignore-scripts
      - name: Build the website
        working-directory: apps/web
        env:
          SITE_BASE: /EchoSpeak/
        run: npm run build:site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
